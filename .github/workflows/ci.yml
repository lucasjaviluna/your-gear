name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and policy tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build, pack, install and smoke CLI
        run: npm run pack:check
